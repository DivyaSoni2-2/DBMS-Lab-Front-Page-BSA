<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBMS Lab Front Page Maker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--text:#1d2430;--muted:#5d6675;--line:#d5d9e0;--accent:#1f4e9c;--accent-text:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d222a;--text:#e8ebf0;--muted:#9aa3b2;--line:#363d49;--accent:#6c9bff;--accent-text:#0b1220}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d222a;--text:#e8ebf0;--muted:#9aa3b2;--line:#363d49;--accent:#6c9bff;--accent-text:#0b1220}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,320px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
h1{font-size:1.15rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--muted);font-size:.9rem}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input{width:100%;padding:10px 12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;margin-top:18px;padding:12px;font-size:1rem;font-weight:600;border:0;border-radius:8px;background:var(--accent);color:var(--accent-text);cursor:pointer}
button:disabled{opacity:.6;cursor:default}
#msg{min-height:1.2em;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
#msg.err{color:#c0392b}
.preview{padding:12px;display:flex;justify-content:center}
canvas{width:100%;max-width:595px;height:auto;aspect-ratio:595/842;background:#fff;border:1px solid var(--line);border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>DBMS Lab – Front Page</h1>
    <p class="sub">Fill in your details, check the preview, then download the PDF.</p>
    <label for="name">Name</label>
    <input id="name" maxlength="40" placeholder="e.g. Rahul Sharma" autocomplete="name">
    <label for="roll">Roll No.</label>
    <input id="roll" maxlength="20" placeholder="e.g. 2401234567" inputmode="text">
    <label for="sec">Section</label>
    <input id="sec" maxlength="10" placeholder="e.g. A">
    <button id="dl" type="button">Download PDF</button>
    <p id="msg" role="status"></p>
  </div>
  <div class="card preview"><canvas id="cv" aria-label="Front page preview"></canvas></div>
</div>

function drawPreview() {
  var k = 2; // render at 2x for sharpness
  cv.width = Math.round(W * k); cv.height = Math.round(H * k);

      doc.setFontSize(o.z);
      if (o.t === "text") {
        doc.text(o.s, o.x, o.y, {align: o.a === "c" ? "center" : o.a === "r" ? "right" : "left"});
      } else {
        doc.text(o.l, o.x, o.y);
        doc.text(" " + o.v, o.x + doc.getTextWidth(o.l), o.y);
      }
    }
  });
  return doc;
}

var msg = document.getElementById("msg");
function say(t, err) { msg.textContent = t; msg.className = err ? "err" : ""; }

["name", "roll", "sec"].forEach(function (id) {
  document.getElementById(id).addEventListener("input", drawPreview);
});

document.getElementById("dl").addEventListener("click", async function () {
  var v = vals();
  if (!v.name || !v.roll || !v.sec) { say("Please fill in Name, Roll No. and Section first.", true); return; }
  if (/[^\x20-\x7E\u00A0-\u00FF]/.test(v.name + v.roll + v.sec)) {
    say("Please use English letters and digits only (the PDF font can't show other scripts).", true); return;
  }
  if (!window.jspdf) { say("PDF library didn't load. Check your internet and reload.", true); return; }
  var btn = this; btn.disabled = true;
  try {
    var doc = buildPdf();
    var fname = "DBMS_Front_Page_" + v.roll.replace(/[^A-Za-z0-9_-]+/g, "") + ".pdf";
    var blob = doc.output("blob");
    var dls = null;
    try { dls = await claude.use("downloads"); } catch (e) { dls = null; }
    if (dls) {
      await dls.save({filename: fname, data: blob});
    } else {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = fname;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    say("Done: " + fname);
  } catch (e) {
    if (e && e.code === "declined") say("Download cancelled.");
    else say("Could not create the PDF. Please try again.", true);
  } finally { btn.disabled = false; }
});
</script>
</body>
